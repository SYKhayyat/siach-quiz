<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Quiz — siachshai.online</title>
<meta name="description" content="12 computer science topics, 20 questions per round — multiple choice plus written and coding answers, graded instantly.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="topbar">
  <div class="hrow">
    <button class="btn ghost" id="topicsBtn">← Topics</button>
    <div class="bar" title="Correct (green) vs wrong (red)"><div class="seg-g" id="segG"></div><div class="seg-r" id="segR"></div></div>
    <div class="meta"><span id="progText"></span><span id="scoreText"></span><span id="timer" title="Elapsed time">00:00</span></div>
  </div>
  <div class="hrow push-down">
    <span class="topicbar" id="topicBar"></span>
    <div class="bar-thin" title="Progress"><div id="progFill"></div></div>
  </div>
  <div id="circles"></div>
</header>
<main>
  <section id="viewHome"></section>
  <section id="viewSetup" class="hidden"></section>
  <section id="viewQuiz" class="hidden"><div id="questions"></div></section>
  <section id="viewResult" class="hidden"></section>
</main>
<footer>12 topics · 20 questions per round · written answers graded on the spot · code run in your browser (Rust via play.rust-lang.org)</footer>
<script type="module" src="js/main.js"></script>
</body>
</html>
